<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12163b">
  <meta name="description" content="Martin Tsai 的精彩活動首頁，收藏宜蘭狐狸村與古夫金字塔 VR 沉浸體驗。">
  <title>我的精彩活動｜Martin Tsai</title>
  <style>
    :root {
      --ink: #161a35;
      --muted: #626985;
      --paper: #fbfbff;
      --white: #fff;
      --fox: #ff7a2f;
      --fox-soft: #ffbd52;
      --vr: #25235d;
      --gold: #ffc75a;
      --radius: 32px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 12%, rgba(255, 190, 82, .32), transparent 30rem),
        radial-gradient(circle at 92% 84%, rgba(92, 90, 220, .24), transparent 32rem),
        linear-gradient(145deg, #fff7ea 0%, #f5f4ff 46%, #edf7ff 100%);
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      z-index: -1;
      width: 18rem;
      aspect-ratio: 1;
      border-radius: 50%;
      filter: blur(2px);
      opacity: .5;
      animation: drift 10s ease-in-out infinite alternate;
    }

    body::before {
      top: -8rem;
      right: -5rem;
      background: repeating-radial-gradient(circle, #fff 0 4px, transparent 5px 18px);
    }

    body::after {
      bottom: -10rem;
      left: -6rem;
      border: 1.5rem solid rgba(255,255,255,.55);
      animation-delay: -4s;
    }

    @keyframes drift {
      to { transform: translate3d(1.5rem, 1rem, 0) rotate(9deg); }
    }

    .shell {
      width: min(1180px, calc(100% - 32px));
      margin-inline: auto;
      padding: 34px 0 26px;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 26px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 10px;
      color: #575d79;
      font-size: .82rem;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 30px;
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--fox), #815cff);
    }

    h1 {
      margin: 0;
      font-size: clamp(2.25rem, 5vw, 4.8rem);
      line-height: .98;
      letter-spacing: -.065em;
    }

    h1 span {
      color: transparent;
      background: linear-gradient(102deg, #f15f27 0%, #d53f79 42%, #493fd0 100%);
      background-clip: text;
      -webkit-background-clip: text;
    }

    .intro {
      max-width: 360px;
      margin: 0 4px 5px 0;
      color: var(--muted);
      font-size: 1rem;
      font-weight: 650;
      line-height: 1.75;
      text-align: right;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
    }

    .activity {
      --accent: var(--fox-soft);
      position: relative;
      isolation: isolate;
      min-height: 560px;
      border-radius: var(--radius);
      overflow: hidden;
      color: var(--white);
      box-shadow: 0 26px 60px rgba(32, 31, 76, .19);
      transform: perspective(1000px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateY(0);
      transition: transform .32s ease, box-shadow .32s ease;
      text-decoration: none;
      outline: none;
    }

    .activity:hover {
      transform: perspective(1000px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateY(-7px);
      box-shadow: 0 35px 76px rgba(32, 31, 76, .28);
    }

    .activity:focus-visible {
      box-shadow: 0 0 0 5px #fff, 0 0 0 9px var(--accent), 0 30px 70px rgba(32,31,76,.25);
    }

    .activity::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background-image:
        linear-gradient(180deg, rgba(7, 10, 31, .04) 8%, rgba(8, 11, 30, .22) 46%, rgba(7, 8, 24, .96) 100%),
        var(--cover);
      background-position: center;
      background-size: cover;
      transition: transform .7s cubic-bezier(.2,.7,.2,1), filter .4s ease;
    }

    .activity:hover::before { transform: scale(1.045); filter: saturate(1.06); }

    .activity::after {
      content: "";
      position: absolute;
      inset: 1px;
      z-index: 3;
      pointer-events: none;
      border: 1px solid rgba(255,255,255,.36);
      border-radius: calc(var(--radius) - 1px);
    }

    .card-top {
      position: absolute;
      inset: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px;
    }

    .date {
      padding: 9px 13px;
      border: 1px solid rgba(255,255,255,.48);
      border-radius: 999px;
      background: rgba(11,12,34,.32);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      font-size: .78rem;
      font-weight: 900;
      letter-spacing: .08em;
    }

    .number {
      font-family: Georgia, serif;
      font-size: 1.35rem;
      font-style: italic;
      opacity: .9;
    }

    .content {
      position: absolute;
      inset: auto 0 0;
      padding: 30px;
    }

    .kicker {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 10px;
      color: var(--accent);
      font-size: .85rem;
      font-weight: 900;
      letter-spacing: .14em;
    }

    .kicker::before {
      content: "";
      width: 9px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 0 5px color-mix(in srgb, currentColor 22%, transparent);
    }

    h2 {
      margin: 0;
      max-width: 15ch;
      font-size: clamp(2rem, 4vw, 3.4rem);
      line-height: 1.08;
      letter-spacing: -.045em;
    }

    .summary {
      margin: 15px 0 22px;
      max-width: 31rem;
      color: rgba(255,255,255,.82);
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.68;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      min-height: 48px;
      padding: 0 18px;
      border-radius: 16px;
      color: #16162b;
      background: var(--accent);
      font-size: .95rem;
      font-weight: 900;

    }

    .arrow {
      display: grid;
      place-items: center;
      width: 26px;
      aspect-ratio: 1;
      border-radius: 50%;
      color: #fff;
      background: #17172a;
      transition: transform .28s ease;
    }

    .activity:hover .arrow { transform: translateX(4px); }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      padding: 22px 4px 0;
      color: #6c728a;
      font-size: .84rem;
      font-weight: 700;
    }

    .signature { color: #363b5a; }

    @media (max-width: 760px) {
      .shell { width: min(100% - 22px, 560px); padding-top: 24px; }
      header { display: block; margin-bottom: 20px; padding-inline: 4px; }
      .intro { margin: 14px 0 0; max-width: 30rem; text-align: left; }
      .grid { grid-template-columns: 1fr; gap: 16px; }
      .activity { min-height: 510px; border-radius: 26px; }
      .activity::after { border-radius: 25px; }
      .content { padding: 24px; }
      .card-top { padding: 20px; }
      h2 { max-width: 13ch; }
      footer { flex-direction: column; gap: 6px; padding: 18px 4px 4px; }
    }

    @media (max-width: 420px) {
      .activity { min-height: 465px; }
      .summary { font-size: .95rem; margin: 12px 0 18px; }
      .fox-card::before { background-position: 42% center; }
      .vr-card::before { background-position: 60% center; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow">Martin's activity journal · 2026</p>
        <h1>我的<span>精彩活動</span></h1>

      <a class="activity fox-card" href="https://martin-team-0506.github.io/Activities/20260709_Fox.html" target="_blank" rel="noopener noreferrer" aria-label="開啟 2026年7月9日宜蘭狐狸村活動網誌">
        <div class="card-top">
          <span class="date">2026.07.09 · YILAN</span>
          <span class="number" aria-hidden="true">01</span>
        </div>
        <div class="content">
          <p class="kicker">夏日萌寵小旅行</p>

        </div>
      </a>

        <div class="card-top">

        <div class="content">
          <p class="kicker">四千五百年時空探險</p>

      <span>© 2026 Martin Tsai</span>
    </footer>

  <script>
    const cards = document.querySelectorAll('.activity');
    const finePointer = matchMedia('(pointer: fine)').matches;

    if (finePointer && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
      cards.forEach((card) => {
        card.addEventListener('pointermove', (event) => {
          const rect = card.getBoundingClientRect();
          const x = (event.clientX - rect.left) / rect.width - 0.5;
          const y = (event.clientY - rect.top) / rect.height - 0.5;
          card.style.setProperty('--ry', `${x * 4}deg`);
          card.style.setProperty('--rx', `${y * -4}deg`);
        });
        card.addEventListener('pointerleave', () => {
          card.style.setProperty('--ry', '0deg');
          card.style.setProperty('--rx', '0deg');
        });
      });
    }
  </script>
